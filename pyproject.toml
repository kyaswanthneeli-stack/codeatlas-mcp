[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeatlas-mcp"
version = "0.1.0"
description = "Local Python code structure and impact queries over MCP"
requires-python = ">=3.10"
dependencies = ["mcp>=1.12,<2"]

[project.scripts]
codeatlas = "codeatlas.cli:main"

[tool.setuptools.packages.find]
include = ["codeatlas*"]
