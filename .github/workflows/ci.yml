name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - run: python -m compileall -q codeatlas benchmarks tests
      - run: python -m unittest discover -s tests -v

  real-token-benchmark:
    name: Real-repository tokenizer measurement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . 'tiktoken>=0.7,<1'
      - name: Measure tokens on this repository
        run: python benchmarks/token_benchmark.py --root . --output benchmark-token-results.json
      - name: Upload measured result
        uses: actions/upload-artifact@v4
        with:
          name: codeatlas-real-repository-token-benchmark
          path: benchmark-token-results.json
